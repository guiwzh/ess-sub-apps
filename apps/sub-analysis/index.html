<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sub-analysis</title>
    <!--
      vendor 来源由 VITE_VENDOR_BASE 控制：
        - 空值（默认 dev/standalone）：加载子应用自己的 /vendor/*.js
        - 例如 '/main' 或 'https://main.host'：复用主应用的 vendor（用于 wujie 主子一体部署，三应用共享 HTTP 缓存）
    -->
    <script type="importmap">
    {
      "imports": {
        "react": "%VITE_VENDOR_BASE%/vendor/react.js",
        "react/jsx-runtime": "%VITE_VENDOR_BASE%/vendor/react/jsx-runtime.js",
        "react/jsx-dev-runtime": "%VITE_VENDOR_BASE%/vendor/react/jsx-dev-runtime.js",
        "react-dom": "%VITE_VENDOR_BASE%/vendor/react-dom.js",
        "react-dom/client": "%VITE_VENDOR_BASE%/vendor/react-dom/client.js",
        "react-router-dom": "%VITE_VENDOR_BASE%/vendor/react-router-dom.js",
        "axios": "%VITE_VENDOR_BASE%/vendor/axios.js",
        "dayjs": "%VITE_VENDOR_BASE%/vendor/dayjs.js"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
